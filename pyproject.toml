[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kleuw"
version = "0.1.0"
description = "Kleuw is a tool for capturing, managing, and validating semantic relationships between files — including line-level links — and detecting staleness when linked regions change."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "Kleuw Contributors" }
]
dependencies = []  # Runtime: standard library only

[project.optional-dependencies]
dev = [
  "black",
  "isort",
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
]

[project.scripts]
kleuw = "kleuw.cli:main"

# -------------------------
# Black (code formatting)
# -------------------------
[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
)/
'''

# -------------------------
# isort (import sorting)
# -------------------------
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["kleuw"]
skip = [".venv", ".mypy_cache", ".ruff_cache", "build", "dist"]

# -------------------------
# Ruff (linting)
# -------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
respect-gitignore = true
src = ["src"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "W",  # pycodestyle warnings
  "I",  # isort import rules
  "B",  # bugbear
  "UP", # pyupgrade
]
ignore = [
  "E501",  # line length handled by black
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -------------------------
# mypy (static typing)
# -------------------------
[tool.mypy]
python_version = "3.10"
packages = ["kleuw"]
mypy_path = ["src"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
show_error_codes = true
pretty = true

# Allow tests to be looser if needed
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# -------------------------
# pytest (unit tests)
# -------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=kleuw --cov-report=term-missing --cov-fail-under=80"
markers = [
  "gui: marks tests that exercise the Tkinter GUI (may be skipped on headless CI)",
]

# -------------------------
# coverage.py (via pytest-cov)
# -------------------------
[tool.coverage.run]
source = ["kleuw"]
branch = true
omit = [
  "src/kleuw/__main__.py",
]
disable_warnings = [
  "module-not-measured",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

# -------------------------
# Setuptools package discovery
# -------------------------
[tool.setuptools.packages.find]
where = ["src"]
include = ["kleuw*"]
